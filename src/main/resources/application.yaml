spring:
  application:
    name: money-transfer-service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
  liquibase:
    change-log: db/changelog/db.changelog-master.xml
    enabled: true

server:
  port: ${SERVER_PORT}

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000

currency:
  converter:
    service:
      url: ${CURRENCY_SERVICE_URL}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    version: v1
  api-docs:
    path: /api-docs

ngrok:
  tunnel-url: https://${NGROK_TUNNEL_URL}

jwt:
  secret: ${JWT_TOKEN}